
server:
  port: 8083

spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillforge_users}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  security:
    # JWT validation is configured in SecurityConfig below.
    filter:
      order: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Supply the same Base64-encoded signing secret as auth-service.
jwt:
  secret: ${JWT_SECRET}

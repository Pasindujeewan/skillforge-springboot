spring.application.name=auth-service

server.port=8081

# PostgreSQL


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

# JWT

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=900000
user-service.base-url=http://USER-SERVICE
user-service.circuit-breaker.sliding-window-size=10
user-service.circuit-breaker.minimum-number-of-calls=5
user-service.circuit-breaker.failure-rate-threshold=50
user-service.circuit-breaker.wait-duration-in-open-state=10s
user-service.circuit-breaker.permitted-number-of-calls-in-half-open-state=3

# Eureka

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# Internal service JWT
security.internal-jwt.secret=${INTERNAL_JWT_SECRET}
security.internal-jwt.expiration=${INTERNAL_JWT_EXPIRATION:60000}